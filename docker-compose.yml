version: '3.6'
services:
  ustreamer:
    #build:
      #context: ./images/ustreamer/
    image: ${HARBOR_REGISTRY:-harbor.192.168.0.110.nip.io}/${HARBOR_PROJECT:-tinypilot}/ustreamer:${IMAGE_TAG:-latest}
    container_name: ustreamer
    restart: always
    ports:
      - "8001:8001"
    devices:
      - /dev/video0:/dev/video0
    command: ["ustreamer", "--host=0.0.0.0", "--resolution=1920x1080","--encoder=hw", "--format=mjpeg", "--port=8001", "/dev/video0"] #1280x720

  tinypilot:
   # build:
   #   context: ./images/tinypilot/
    image: ${HARBOR_REGISTRY:-harbor.192.168.0.110.nip.io}/${HARBOR_PROJECT:-tinypilot}/tinypilot:${IMAGE_TAG:-latest}
    container_name: tinypilot
    restart: always
    ports:
      - "8000:8000"
    devices:
     - /dev/hidg0:/dev/hidg0
     - /dev/hidg1:/dev/hidg1
    volumes:
      - ./config/config.py:/opt/tinypilot/config.py  # Tinypilot 설정 파일 마운트
      - tinypilot-home:/home/tinypilot

    command: ["python3", "/opt/tinypilot/app/main.py"]

  # --- 추가된 Tailscale 서비스 ---
  tailscale:
   # build:
   #   context: ./images/tailscale  # Dockerfile이 있는 위치를 지정
    image: ${HARBOR_REGISTRY:-harbor.192.168.0.110.nip.io}/${HARBOR_PROJECT:-tinypilot}/tailscale:${IMAGE_TAG:-latest}
    container_name: tailscale
    restart: always
    hostname: ${TS_HOSTNAME}         # 컨테이너의 호스트 이름을 설정 (start.sh와 일치)
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Tailscale이 작동하기 위해 필수적인 설정입니다.
    devices:
      - "/dev/net/tun:/dev/net/tun"  # 가상 네트워크 인터페이스 사용을 위해 필요
    cap_add:
      - net_admin                  # 네트워크 관리자 권한 부여
      - sys_module                 # 시스템 모듈 관련 권한 부여
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME}
      - TS_SERVE_PORT=${TS_SERVE_PORT:-443}
    volumes:
      - tailscale-state:/var/lib/tailscale

volumes:
  tinypilot-home:
  tailscale-state:
